services:
  # -------------------------------------------------------------
  # 1. Spring Boot Backend Web Service
  # -------------------------------------------------------------
  - type: web
    name: student-backend
    runtime: docker
    dockerfilePath: ./student/Dockerfile
    dockerContext: ./student
    plan: free
    region: oregon
    envVars:
      - key: PORT
        value: 8080
      - key: DB_HOST
        fromDatabase:
          name: student-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: student-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: student-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: student-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: student-db
          property: password

  # -------------------------------------------------------------
  # 2. Vite + React Frontend Static Site
  # -------------------------------------------------------------
  - type: web
    name: student-frontend
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: student-backend
          property: host

# ---------------------------------------------------------------
# 3. PostgreSQL Managed Database
# ---------------------------------------------------------------
databases:
  - name: student-db
    databaseName: db_student
    plan: free
    region: oregon
